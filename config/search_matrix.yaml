  - Continuous Improvement Lead
  - Continuous Improvement Manager
  - Strategic Sourcing Manager
  - Procurement Manager
  - Category Manager Procurement
  - Process Excellence Lead
  - Business Operations Analyst
  - Business Operations Manager
  - Strategy and Operations Manager
  - Operational Excellence Manager
  - Business Process Analyst
  - Supply Chain Transformation Consultant
  - Lean Six Sigma Consultant
  - Spend Analytics Manager
  - Program Manager Operations
  - Management Consultant Operations
  - Sourcing Analyst
  - Procurement Excellence Analyst
  - Transformation Consultant

# Short, high-signal keyword seeds for API-based boards (they do poor phrase matching)

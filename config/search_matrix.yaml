  - procurement
  - sourcing
  - continuous improvement
  - process excellence
  - operational excellence
  - business operations
  - strategy and operations
  - operations manager
  - lean six sigma
  - supply chain
  - spend analytics
  - transformation
  - business analyst operations
  - category manager

work_modes: [remote, hybrid]

locations:
  - India
  - Remote
  - Worldwide
  - Bangalore, India
  - Mumbai, India
  - Pune, India
  - Gurgaon, India
  - Hyderabad, India

# JobSpy (LinkedIn / Indeed / Glassdoor / ZipRecruiter / Naukri / Google)
#
# Verified from this network:
#   linkedin, indeed  -> working
#   zip_recruiter     -> HTTP 403 (Cloudflare blocks datacentre IPs)
#   naukri            -> HTTP 406 "recaptcha required"
#   glassdoor, google -> return 0 results (anti-bot)
# Add residential proxies below to unlock the blocked sites, then move them into
# `sites`. Leaving a blocked site in `sites` only wastes time — it never returns rows.
jobspy:
  enabled: true
  sites: [linkedin, indeed]
  blocked_without_proxy: [zip_recruiter, naukri, glassdoor, google]
  proxies: []          # e.g. ["user:pass@host:port", ...]
  results_wanted: 25
  hours_old: 72
  country_indeed: India
  is_remote: true
  locations: ["India", "Remote, India"]

# Y Combinator / Work at a Startup — well-paid, often-remote startup roles with far
# less competition than the mainstream aggregators. No credentials required.
ycombinator:
  enabled: true
  roles: [operations, finance, product]


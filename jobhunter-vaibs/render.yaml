services:
  - type: web
    name: jobhunter-vaibs
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: JOBHUNTER_PROFILE
        value: "config/profile_vaibhav.yaml"
    plan: free

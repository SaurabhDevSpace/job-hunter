primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  JOBHUNTER_PROFILE = "config/profile_ragini.yaml"
  JOBHUNTER_SEARCH_MATRIX = "config/search_matrix_ragini.yaml"
  JOBHUNTER_DB = "/data/jobhunter.sqlite3"
  JOBHUNTER_DATA_DIR = "/data"
  PORT = "8080"

[mounts]
  source = "jobhunter_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

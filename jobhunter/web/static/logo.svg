<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Job seeker searching listings with a magnifying glass">
  <defs>
    <linearGradient id="jhBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e4fd8"/>
      <stop offset="1" stop-color="#12b8e6"/>
    </linearGradient>
    <linearGradient id="jhLens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#8ed8fb" stop-opacity=".6"/>
    </linearGradient>
    <clipPath id="jhClip"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#jhBg)"/>

  <g clip-path="url(#jhClip)">
    <!-- listings board she is scanning -->
    <g opacity=".97">
      <rect x="30" y="12" width="26" height="34" rx="3.5" fill="#f7fafc"/>
      <rect x="34" y="17" width="12" height="3" rx="1.5" fill="#1e4fd8"/>
      <rect x="34" y="24" width="18" height="2.4" rx="1.2" fill="#c8d4e2"/>
      <rect x="34" y="29" width="14" height="2.4" rx="1.2" fill="#c8d4e2"/>
      <rect x="34" y="34" width="17" height="2.4" rx="1.2" fill="#c8d4e2"/>
      <rect x="34" y="39" width="10" height="2.4" rx="1.2" fill="#c8d4e2"/>
    </g>

    <!-- job seeker: shoulders, hair, face -->
    <path d="M6 58c0-8.6 5.4-13.6 13.5-13.6S33 49.4 33 58v6H6z" fill="#22345c"/>
    <path d="M12.6 45.6c2 3.2 4.3 4.8 6.9 4.8s4.9-1.6 6.9-4.8l-2.2-2.4h-9.4z" fill="#f0b998"/>
    <path d="M11.3 26.6c0-5.1 3.7-8.6 8.2-8.6s8.2 3.5 8.2 8.6c0 1.6-.3 3-.6 4.6l-1 5.2c-.7 3.6-3.4 5.9-6.6 5.9s-5.9-2.3-6.6-5.9l-1-5.2c-.3-1.6-.6-3-.6-4.6z" fill="#f7c6a4"/>
    <!-- hair: crown, side sweep and ponytail -->
    <path d="M10.6 29.4c-.7-3.4-.4-6.6 1.4-9.1 2-2.9 5.2-4.3 8.6-4.1 3.6.2 6.6 2 8 5.1 1 2.2 1.1 4.8.6 8-.4-2.3-1-4-1.8-5.2-4 1.7-8.3 1.9-12.9.5-1.7 1-2.9 2.6-3.5 4.8z" fill="#3b2a24"/>
    <path d="M27.8 30.2c2.4 2.6 3.4 5.6 3 9-.2 1.8-.9 3.3-2 4.6.4-3.3.1-6.1-1-8.4z" fill="#3b2a24"/>
    <circle cx="16.4" cy="29.8" r="1.25" fill="#2f2320"/>
    <circle cx="23.2" cy="29.8" r="1.25" fill="#2f2320"/>
    <path d="M17.6 34.6c1.4 1.1 2.9 1.1 4.4 0" stroke="#c9805f" stroke-width="1.2"
          stroke-linecap="round" fill="none"/>

    <!-- raised arm holding the magnifier -->
    <path d="M27.4 51.4c3.6-.6 6.6-2.6 9-6" stroke="#22345c" stroke-width="5.4"
          stroke-linecap="round" fill="none"/>
    <circle cx="37.6" cy="44.2" r="3.1" fill="#f7c6a4"/>
  </g>

  <!-- magnifying glass: dark rim so it reads against both the white card and the blue field -->
  <g transform="translate(0.5 -0.5)">
    <path d="M48.8 37.8l7.4 7.4" stroke="#12306b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="40.8" cy="29.8" r="10.4" fill="url(#jhLens)"/>
    <circle cx="40.8" cy="29.8" r="10.4" fill="none" stroke="#12306b" stroke-width="3"/>
    <path d="M36.2 25.8a6.2 6.2 0 0 1 4.1-2.6" stroke="#ffffff" stroke-width="1.9"
          stroke-linecap="round" fill="none" opacity=".9"/>
  </g>
</svg>

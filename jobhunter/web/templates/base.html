<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<title>{% block title %}Deep Job Search Portal{% endblock %}</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3341;
    --fg:#e6edf3; --muted:#8b949e; --accent:#4493f8; --good:#3fb950;
    --warn:#d29922; --bad:#f85149; --gold:#e3b341;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  header{background:linear-gradient(135deg,#12243b,#0d1117);border-bottom:1px solid var(--line);
         padding:16px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;letter-spacing:-.2px}
  header .sub{color:var(--muted);font-size:12px}
  header .brand{display:flex;align-items:center;gap:13px}
  header .brand img{width:44px;height:44px;border-radius:12px;flex:0 0 auto;
                    box-shadow:0 3px 12px rgba(30,79,216,.45)}
  .wrap{max-width:1500px;margin:0 auto;padding:20px 24px 60px}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .card .v{font-size:24px;font-weight:650;margin-top:4px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
  .panel h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;
     letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
  td{padding:9px 10px;border-bottom:1px solid #1f2733;vertical-align:top}
  tr:hover td{background:var(--panel2)}
  .badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;
         border:1px solid transparent}
  .t-Aplus{background:rgba(63,185,80,.16);color:#56d364;border-color:rgba(63,185,80,.4)}
  .t-A{background:rgba(68,147,248,.16);color:#79c0ff;border-color:rgba(68,147,248,.4)}
  .t-B{background:rgba(210,153,34,.16);color:#e3b341;border-color:rgba(210,153,34,.4)}
  .t-C{background:rgba(139,148,158,.16);color:var(--muted);border-color:#333c4a}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);
        border-radius:6px;padding:1px 7px;font-size:11px;color:var(--muted);margin:2px 3px 2px 0}
  .chip.hidden-src{background:rgba(227,179,65,.14);color:var(--gold);border-color:rgba(227,179,65,.4)}
  .chip.remote{background:rgba(63,185,80,.14);color:#56d364;border-color:rgba(63,185,80,.35)}
  .chip.hybrid{background:rgba(68,147,248,.14);color:#79c0ff;border-color:rgba(68,147,248,.35)}
  .bar{height:6px;background:#20283a;border-radius:4px;overflow:hidden;min-width:70px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#2f81f7,#3fb950)}
  button,.btn{background:var(--accent);color:#08121f;border:0;border-radius:7px;padding:7px 14px;
              font-weight:650;font-size:13px;cursor:pointer}
  button:hover,.btn:hover{filter:brightness(1.12);text-decoration:none}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
               border-radius:7px;padding:7px 10px;font-size:13px}
  form.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted)} .small{font-size:12px} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pill{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .on{background:rgba(63,185,80,.16);color:#56d364} .off{background:rgba(248,81,73,.16);color:#ff7b72}
  pre{background:#0b0f16;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12px}
  .split{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
  @media(max-width:1000px){.split{grid-template-columns:1fr}}
  #toast{position:fixed;right:18px;bottom:18px;background:var(--panel);border:1px solid var(--line);
         border-radius:9px;padding:12px 16px;display:none;max-width:460px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #toast a.dl{display:block;padding:6px 9px;margin-top:6px;border:1px solid var(--line);
              border-radius:6px;text-decoration:none;background:#111823}
  #toast a.dl:hover{border-color:var(--acc)}
  #toast a.dl .fn{display:block;font-size:11px;color:var(--muted);word-break:break-all}
  #toast .close{float:right;cursor:pointer;color:var(--muted);margin-left:10px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/static/logo.svg" alt="Job search logo" width="44" height="44">
    <div>
      <h1>Deep Job Search &amp; Tailored Resume Engine</h1>
      <div class="sub">{{ profile.name }} — {{ profile.headline }}</div>
    </div>
  </div>
  <div style="margin-left:auto" class="row">
    <a class="btn ghost" href="/">Dashboard</a>
    <a class="btn ghost" href="/api/config" target="_blank">Config</a>
    <a class="btn ghost" href="/api/llm/test" target="_blank">Test LLM</a>
  </div>
</header>
<div class="wrap">{% block content %}{% endblock %}</div>
<div id="toast"></div>
<script>
function toast(msg, ms){const t=document.getElementById('toast');t.innerHTML=msg;t.style.display='block';
  clearTimeout(window.__tt);
  // Downloads must stay on screen until dismissed, otherwise the links vanish mid-click.
  if(ms!==0){window.__tt=setTimeout(()=>t.style.display='none',ms||6000);}}
function hideToast(){const t=document.getElementById('toast');t.style.display='none';clearTimeout(window.__tt);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function downloadsHtml(j){
  if(!j || !Array.isArray(j.downloads) || !j.downloads.length) return '';
  let h='<div style="margin-top:8px"><b>Download</b>';
  if(j.generated_by){h+=' <span class="muted small">via '+esc(j.generated_by);
    if(j.ats_alignment){h+=' · ATS '+esc(j.ats_alignment)+'%';}h+='</span>';}
  h+='</div>';
  for(const d of j.downloads){
    h+='<a class="dl" href="'+esc(d.url)+'" download>⬇ '+esc(d.label)+
       '<span class="fn">'+esc(d.filename)+'</span></a>';
    if(d.preview_url){
      const isPdf = /\.pdf$/i.test(d.filename||'');
      h+='<a class="dl" href="'+esc(d.preview_url)+'" target="_blank" rel="noopener">'+
         '👁 '+(isPdf?'Preview PDF':'Preview designed resume')+
         '<span class="fn">opens in a new tab'+(isPdf?'':' · print to PDF')+'</span></a>';
    }
  }
  return h;
}

async function post(url, label){
  toast('⏳ '+(label||'Working')+'…', 60000);
  try{
    const r=await fetch(url,{method:'POST'});
    const j=await r.json();
    if(!r.ok){
      toast('<b>⚠️ Error</b><pre>'+esc(JSON.stringify(j,null,1).slice(0,700))+'</pre>',15000);
      return j;
    }
    const dl=downloadsHtml(j);
    if(dl){
      toast('<span class="close" onclick="hideToast()">✕</span><b>✅ '+esc(label||'Done')+'</b>'+dl, 0);
      if(typeof refreshArtifacts==='function'){refreshArtifacts();}
    }else{
      toast('<b>✅ Done</b><pre>'+esc(JSON.stringify(j,null,1).slice(0,700))+'</pre>',12000);
    }
    return j;
  }catch(e){toast('⚠️ '+esc(e),8000);}
}
</script>
</body>
</html>
